<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Grid - Sass</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="demo">
    <div class="grid-container">
      <div class="grid-wrapper grid-wrapper--header">
        <div class="grid-content grid-content--header"></div>
      </div>

      <div class="grid-wrapper grid-wrapper--body">
        <div class="grid-content sidebar">
          <div class="sidebar__item"></div>
          <div class="sidebar__item"></div>
          <div class="sidebar__item"></div>
          <div class="sidebar__item"></div>
        </div>

        <div class="grid-content empty"></div>
        <div class="grid-content empty"></div>
        <div class="grid-content empty"></div>
        <div class="grid-content empty"></div>
        <div class="grid-content empty"></div>
        <div class="grid-content empty"></div>

        <div class="grid-content right-panel">
          <div class="right-panel__block"></div>
        </div>
      </div>

      <div class="grid-wrapper grid-wrapper--footer">
        <div class="grid-content grid-content--footer"></div>
      </div>
    </div>

    <div class="grid-container grid-container--guide" aria-hidden="true">
      <div class="grid-wrapper grid-wrapper--guide">
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
        <div class="grid-content guide-column"></div>
      </div>
    </div>
  </main>
  <p class="hint">Thay đổi kích thước cửa sổ trình duyệt để quan sát bố cục responsive.</p>
</body>
</html>
