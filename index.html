<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thực hành grid-template-columns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Thực hành thuộc tính grid-template-columns</h1>

    <section class="example">
      <h2>Ví dụ 1: Ba cột bằng nhau</h2>
      <div class="grid-container grid-equal">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
      </div>
    </section>

    <section class="example">
      <h2>Ví dụ 2: Các cột có kích thước khác nhau</h2>
      <div class="grid-container grid-different">
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
      </div>
    </section>
  </main>
</body>
</html>
